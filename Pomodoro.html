<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Pomodoro.css">
    <title>Pomodoro Clock</title>
</head>

<body>

    <div id="container">

        <!-- Labels -->
        <p id="work" class="label">Session</p>
        <p id="break" class="label">Break</p>
        <p id="cycles" class="label">Cycles</p>

        <!-- Session Length Controls -->
        <div id="work-controls" class="controls">
            <button id="work-minus" class="change-btn">−</button>
            <p id="work-length">25</p>
            <button id="work-plus" class="change-btn">+</button>

        </div>

        <!-- Break Length Controls -->
        <div id="break-controls" class="controls">
            <button id="break-minus" class="change-btn">−</button>
            <p id="break-length">5</p>
            <button id="break-plus" class="change-btn">+</button>

        </div>

        <!-- Cycle Counter -->
        <p id="counter" class="timer">0</p>

        <!-- Work Timer -->
        <div id="work-timer" class="timer">
            <p id="timer-status">Session</p>
            <div id="work-time">
                <p id="w_minutes">25</p>
                <p class="semicolon">:</p>
                <p id="w_seconds">00</p>

            </div>
        </div>

        <!-- Break Timer -->
        <div id="break-timer" class="timer">
            <div id="break-time">
                <p id="b_minutes">5</p>
                <p class="semicolon">:</p>
                <p id="b_seconds">00</p>
            </div>

        </div>

        <!-- Buttons -->
        <button id="start" class="btn">Start</button>
        <button id="reset" class="btn">Reset</button>
        <button id="stop" class="btn">Pause</button>

    </div>

    <script src="Pomodoro.js"></script>
</body>

</html>
